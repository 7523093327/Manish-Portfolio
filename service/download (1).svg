      <rect x="74" y="260" width="390" height="40" rx="16" fill="#27231E"></rect>
      <circle cx="100" cy="281" r="6" fill="#FFCC66"></circle>
      <circle cx="120" cy="281" r="6" fill="#FF7648"></circle>
      <circle cx="140" cy="281" r="6" fill="#86A74B"></circle>
      
      <rect x="112" y="330" width="164" height="90" fill="#FFF9EF" stroke="#1F1F1F" stroke-width="2"></rect>
