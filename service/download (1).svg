      <line x1="276" y1="330" x2="112" y2="420" stroke="#1F1F1F" stroke-width="2"></line>
      
      <line x1="306" y1="335" x2="410" y2="335" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round"></line>
      <line x1="306" y1="360" x2="386" y2="360" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round"></line>
      <rect x="306" y="390" width="78" height="38" rx="6" fill="#FFF9EF" stroke="#1F1F1F" stroke-width="2"></rect>
      
      <rect x="112" y="440" width="88" height="28" rx="5" fill="#FFF9EF" stroke="#1F1F1F" stroke-width="2"></rect>
      <rect x="218" y="440" width="88" height="28" rx="5" fill="#FFF9EF" stroke="#1F1F1F" stroke-width="2"></rect>
      <rect x="324" y="440" width="88" height="28" rx="5" fill="#FFF9EF" stroke="#1F1F1F" stroke-width="2"></rect>

      <!-- mobile screen -->
      <rect x="500" y="310" width="98" height="184" rx="18" fill="#FFF6E8" stroke="#1F1F1F" stroke-width="4"></rect>
      <line x1="530" y1="326" x2="568" y2="326" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round"></line>
      <rect x="522" y="360" width="54" height="54" fill="#FFF9EF" stroke="#1F1F1F" stroke-width="2"></rect>
      <line x1="522" y1="360" x2="576" y2="414" stroke="#1F1F1F" stroke-width="2"></line>
      <line x1="576" y1="360" x2="522" y2="414" stroke="#1F1F1F" stroke-width="2"></line>
      <rect x="522" y="438" width="54" height="26" rx="5" fill="#FFF9EF" stroke="#1F1F1F" stroke-width="2"></rect>
