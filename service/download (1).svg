<svg width="700" height="780" viewBox="0 0 700 780" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g id="active-service-panel">
    <rect id="panel-shadow" x="22" y="20" width="656" height="736" rx="26" fill="#1F1F1F" opacity="0.12"></rect>
    <rect id="panel-frame" x="14" y="12" width="656" height="736" rx="26" fill="#FFF6E8" stroke="#1F1F1F" stroke-width="5"></rect>
    <rect id="panel-inner" x="38" y="84" width="608" height="636" rx="18" fill="#FFF9EF" stroke="#1F1F1F" stroke-width="3"></rect>

    <!-- top label -->
    <g id="active-label">
      <circle cx="70" cy="48" r="7" fill="#5B6CFF"></circle>
      <text x="90" y="57" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F1F1F" letter-spacing="2">ACTIVE SERVICE</text>
      <line x1="90" y1="68" x2="178" y2="68" stroke="#5B6CFF" stroke-width="4" stroke-linecap="round"></line>
    </g>

    <!-- text -->
    <text id="service-title" x="74" y="156" font-family="Georgia, serif" font-size="54" font-weight="700" fill="#1F1F1F">UI Design</text>
    <text id="service-description" x="74" y="210" font-family="Inter, Arial, sans-serif" font-size="24" fill="#1F1F1F">Clean interfaces that feel easy to use.</text>

    <!-- visual area -->
