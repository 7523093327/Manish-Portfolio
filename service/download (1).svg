        <rect x="76" y="628" width="28" height="28" rx="6" fill="#FFF9EF" stroke="#1F1F1F" stroke-width="2"></rect>
        <path d="M82 642L89 650L100 634" stroke="#5B6CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
        <text x="122" y="650" font-family="Inter, Arial, sans-serif" font-size="24" fill="#1F1F1F">Screens</text>
      </g>

      <g id="bullet-02">
        <rect x="76" y="672" width="28" height="28" rx="6" fill="#FFF9EF" stroke="#1F1F1F" stroke-width="2"></rect>
        <path d="M82 686L89 694L100 678" stroke="#5B6CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
        <text x="122" y="694" font-family="Inter, Arial, sans-serif" font-size="24" fill="#1F1F1F">Prototypes</text>
      </g>

      <g id="bullet-03">
        <rect x="320" y="628" width="28" height="28" rx="6" fill="#FFF9EF" stroke="#1F1F1F" stroke-width="2"></rect>
        <path d="M326 642L333 650L344 634" stroke="#5B6CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
        <text x="366" y="650" font-family="Inter, Arial, sans-serif" font-size="24" fill="#1F1F1F">Components</text>
      </g>

      <g id="bullet-04">
        <rect x="320" y="672" width="28" height="28" rx="6" fill="#FFF9EF" stroke="#1F1F1F" stroke-width="2"></rect>
        <path d="M326 686L333 694L344 678" stroke="#5B6CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
        <text x="366" y="694" font-family="Inter, Arial, sans-serif" font-size="24" fill="#1F1F1F">Handoff</text>
      </g>
