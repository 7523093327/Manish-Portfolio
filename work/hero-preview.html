<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#120e1d;color:#f8f4ee;font-family:"DM Mono",monospace;overflow:hidden}.page{height:900px;min-height:100vh;position:relative;isolation:isolate;background:radial-gradient(circle at 74% 42%,#6558d4 0 6%,transparent 30%),radial-gradient(circle at 25% 84%,#392269 0,transparent 42%),#120e1d}.noise{position:absolute;inset:0;opacity:.18;background-image:radial-gradient(#fff 0.5px,transparent .6px);background-size:5px 5px;mix-blend-mode:overlay}.top{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:32px 48px;font-size:12px;letter-spacing:.09em;text-transform:uppercase}.mark{font-family:Unbounded,sans-serif;font-weight:800;font-size:16px;letter-spacing:-.12em}.avail{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;background:#c7ff30;border-radius:50%;box-shadow:0 0 15px #c7ff30}.hero{position:relative;z-index:3;width:min(1330px,100%);margin:0 auto;padding:110px 48px}.eyebrow{color:#c7ff30;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.title{font:800 clamp(45px,7vw,103px)/.99 Unbounded,sans-serif;letter-spacing:-.085em;margin:24px 0 28px;max-width:930px}.violet{color:#a69aff;text-shadow:0 0 30px #7869ff}.sub{max-width:465px;font-size:15px;line-height:1.7;color:#d3cddd}.actions{display:flex;gap:20px;align-items:center;margin-top:42px}.primary{background:#c7ff30;color:#130e1d;border:0;padding:16px 22px;font:600 12px "DM Mono";letter-spacing:.06em;text-transform:uppercase}.secondary{color:#f8f4ee;font-size:12px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #f8f4ee;padding:7px 0}.scribble{position:absolute;z-index:2;right:4vw;top:100px;width:44vw;height:560px;max-width:650px}.flower{position:absolute;width:190px;height:190px;border:8px solid #ff5d45;border-radius:46% 54% 50% 50%;right:120px;top:26px;transform:rotate(12deg)}.flower:after,.flower:before{content:"";position:absolute;border:8px solid #ff5d45;border-radius:50%;width:118px;height:118px}.flower:before{left:-91px;top:72px}.flower:after{right:-77px;bottom:-77px}.face{position:absolute;right:67px;top:88px;width:121px;height:95px;border:7px solid #f8f4ee;border-radius:50%;transform:rotate(-9deg)}.eye{position:absolute;width:9px;height:9px;background:#f8f4ee;border-radius:50%;top:34px;left:33px;box-shadow:46px -5px #f8f4ee}.smile{position:absolute;width:47px;height:23px;border-bottom:5px solid #f8f4ee;border-radius:0 0 60px 60px;left:31px;top:48px}.glass{position:absolute;z-index:-1;right:7vw;top:210px;width:390px;height:300px;border-radius:53% 47% 63% 37% / 38% 44% 56% 62%;background:linear-gradient(130deg,rgba(221,207,255,.62),rgba(126,106,254,.16) 48%,rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.58);box-shadow:inset 20px 12px 40px rgba(255,255,255,.28),-14px 19px 60px rgba(33,11,104,.78),0 0 80px #745ee433;backdrop-filter:blur(20px);transform:rotate(-14deg)}.glass:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(215,255,67,.82);top:42px;right:33px;filter:blur(2px);box-shadow:0 0 42px #c7ff30}.slash{position:absolute;right:26px;bottom:8px;color:#c7ff30;font:800 126px/.6 Unbounded}.scroll{position:absolute;bottom:30px;left:48px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#a9a1b9}.scroll:before{content:"↓";margin-right:9px;color:#c7ff30;font-size:17px}@media(max-width:700px){.top,.hero{padding-left:23px;padding-right:23px}.hero{padding-top:84px}.scribble{opacity:.4;right:-90px;top:340px;width:90vw}.title{font-size:46px}.page{height:780px}.scroll{left:23px}}
</style></head><body><main class="page"><div class="noise"></div><nav class="top"><span class="mark">MG.</span><span class="avail"><i class="dot"></i>Available for freelance</span></nav><section class="hero"><p class="eyebrow">Independent product, visual & motion designer</p><h1 class="title">Manish Gaud<br>designs products<br>people want to <span class="violet">move through.</span></h1><p class="sub">I partner with founders and product teams to turn complex ideas into clear, expressive digital experiences.</p><div class="actions"><button class="primary">Start a conversation ↗</button><span class="secondary">Download CV ↓</span></div></section><div class="scribble"><div class="glass"></div><div class="flower"></div><div class="face"><i class="eye"></i><i class="smile"></i></div><b class="slash">✦</b></div><div class="scroll">Scroll to selected work</div></main></body></html>
